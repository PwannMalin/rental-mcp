name: Critic Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  critic:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run critic pipeline
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITTHUB_TOKEN }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          GITHUB_OWNER: PwannMalin
          GITHUB_REPO: rental-mcp
          GITHUB_BASE_BRANCH: main
          NOTIFY_INCLUDE_HIGH_LOGIC: "false"
          CRITIC_BATCH_LIMIT: "30"
        run: |
          set -e
          mkdir -p logs
          STAMP=$(date +%Y-%m-%d_%H-%M-%S)
          LOG=logs/pipeline_$STAMP.log

          echo "$(date -Iseconds)  === Critic pipeline start ===" | tee -a "$LOG"

          echo "$(date -Iseconds)  1/3 criticBatch..." | tee -a "$LOG"
          node src/jobs/criticBatch.js 2>&1 | tee -a "$LOG"
          echo "$(date -Iseconds)  criticBatch exit: $?" | tee -a "$LOG"

          echo "$(date -Iseconds)  2/3 notifyCritiques..." | tee -a "$LOG"
          node src/jobs/notifyCritiques.js 2>&1 | tee -a "$LOG"
          echo "$(date -Iseconds)  notifyCritiques exit: $?" | tee -a "$LOG"

          echo "$(date -Iseconds)  3/3 architectPr..." | tee -a "$LOG"
          node src/jobs/architectPr.js 2>&1 | tee -a "$LOG"
          echo "$(date -Iseconds)  architectPr exit: $?" | tee -a "$LOG"

          echo "$(date -Iseconds)  === Critic pipeline done ===" | tee -a "$LOG"

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critic-pipeline-log
          path: logs/
          retention-days: 14